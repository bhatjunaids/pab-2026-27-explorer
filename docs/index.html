<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAB 2026-27 Explorer</title>
<meta name="description" content="Samagra Shiksha PAB 2026-27 approvals for Haryana, Madhya Pradesh and Uttar Pradesh — every line item, cross-checked against the minutes.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Crect x='7' y='16' width='4' height='9' rx='1' fill='white'/%3E%3Crect x='14' y='10' width='4' height='15' rx='1' fill='white'/%3E%3Crect x='21' y='6' width='4' height='19' rx='1' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --page:#f6f6f3; --surface:#fcfcfb; --surface-2:#f1f0ec; --ink:#0b0b0b; --ink-2:#52514e; --muted:#7a7873;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10); --accent:#2a78d6; --accent-ink:#1c5cab;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --prop:#c9c7bf;
  --good:#006300; --bad:#b42727; --warn-bg:#fff4dc; --warn-ink:#7a4d00; --bad-bg:#fdecec; --good-bg:#e7f5e7;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8f8d86;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --accent:#3987e5; --accent-ink:#86b6ef;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --prop:#4a4945;
    --good:#0ca30c; --bad:#e66767; --warn-bg:#3a2d10; --warn-ink:#f3c867; --bad-bg:#3a1a1a; --good-bg:#15301a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8f8d86;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --accent:#3987e5; --accent-ink:#86b6ef;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --prop:#4a4945;
  --good:#0ca30c; --bad:#e66767; --warn-bg:#3a2d10; --warn-ink:#f3c867; --bad-bg:#3a1a1a; --good-bg:#15301a;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink)}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--grid)}
.bar{max-width:1320px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.brand b{font-size:16px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--ink-2)}
.legend-states{display:flex;gap:12px;font-size:12px;color:var(--ink-2)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.themebtn{border:1px solid var(--ring);background:var(--surface);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px}
nav.tabs{max-width:1320px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:9px 12px;text-decoration:none;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap;font-size:13.5px}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1320px;margin:0 auto;padding:20px 20px 60px}
h1{font-size:22px;letter-spacing:-.015em;margin:0 0 4px}
h2{font-size:17px;letter-spacing:-.01em;margin:28px 0 10px}
h3{font-size:14px;margin:0 0 8px}
p.lede{color:var(--ink-2);margin:0 0 18px;max-width:900px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.g3,.g4{grid-template-columns:1fr 1fr}}
@media (max-width:680px){.g3,.g2,.g4{grid-template-columns:minmax(0,1fr)}.bar{padding:10px 16px}main{padding:16px 16px 60px}nav.tabs{padding:0 16px}}
.statecard{border-top:3px solid var(--c)}
.statecard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.statecard .hd b{font-size:15px}
.statecard .hd span{font-size:12px;color:var(--muted)}
.hero{font-size:30px;font-weight:650;letter-spacing:-.02em;margin:6px 0 0}
.hero small{font-size:14px;font-weight:500;color:var(--ink-2);margin-left:4px}
.sub{font-size:12px;color:var(--ink-2)}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;margin-top:10px;font-size:13px}
.kv span{color:var(--ink-2)}
.kv b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:10px;gap:2px;background:var(--surface)}
.stack i{display:block;height:100%}
.tile{padding:12px 14px}
.tile .l{font-size:12px;color:var(--ink-2)}
.tile .v{font-size:20px;font-weight:650;letter-spacing:-.01em}
.insights{margin:0;padding-left:18px}
.insights li{margin:5px 0}
/* controls */
.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 14px}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--ring);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 11px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:#fff}
.ctl-l{font-size:12px;color:var(--muted);margin-right:-6px}
select{max-width:100%}
select,input[type=search],input[type=text],input[type=password]{background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:6px 10px;min-width:0}
input[type=search]{min-width:min(240px,100%)}
@media (max-width:680px){input[type=search]{min-width:0!important;width:100%}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--ring);border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--ink-2);margin:2px 4px 2px 0}
.chip b{color:var(--ink);font-weight:600}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--ring);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface-2);position:sticky;top:0;z-index:1;white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
td.n,th.n{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.total td{font-weight:650;background:var(--surface-2)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.muted,.muted{color:var(--muted)}
.cellbar{position:relative;min-width:110px}
.cellbar{padding-bottom:10px}
.cellbar i{position:absolute;right:10px;bottom:5px;height:3px;border-radius:2px;background:var(--c);max-width:calc(100% - 20px)}
.cellbar span{position:relative;display:block;text-align:right}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;font-weight:600}
.pill.yes{background:var(--good-bg);color:var(--good)}
.pill.no{background:var(--bad-bg);color:var(--bad)}
.pill.partial{background:var(--warn-bg);color:var(--warn-ink)}
.neg{color:var(--bad)} .pos{color:var(--good)}
.bestmark{font-size:10px;margin-left:4px;color:var(--good);font-weight:700}
/* bar charts */
.hb{display:grid;grid-template-columns:minmax(120px,260px) 1fr;gap:4px 12px;align-items:center;font-size:13px}
.hb .lab{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .rows{display:flex;flex-direction:column;gap:2px;padding:3px 0}
.hb .r{display:flex;align-items:center;gap:6px;height:12px}
.hb .r .tr{flex:1;display:block;height:10px;font-weight:400}
.hb .r i{display:block;height:10px;border-radius:0 4px 4px 0;min-width:1px}
.hb .r span{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:64px;text-align:right}
.hb .sep{grid-column:1/-1;height:1px;background:var(--grid)}
@media (max-width:680px){.hb{grid-template-columns:1fr}.hb .lab{white-space:normal}}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:7px 9px;border-radius:8px;max-width:340px;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;transition:opacity .08s}
.tip.on{opacity:1}
.tip b{font-weight:650}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:10px 0}
.warnbox{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:13px;margin:8px 0}
.okbox{background:var(--good-bg);color:var(--good);border-radius:10px;padding:10px 12px;font-size:13px;margin:8px 0}
details summary{cursor:pointer;color:var(--ink-2);font-size:13px}
.crumbs{font-size:13px;margin:0 0 10px;color:var(--ink-2)}
.crumbs a{cursor:pointer;text-decoration:underline}
.pg{font-size:11px;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
@media (max-width:980px){.two{grid-template-columns:minmax(0,1fr)}}
.ask-box{display:flex;gap:8px}
.ask-box input{flex:1;font-size:15px;padding:10px 12px;border-radius:10px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--ring);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.examples button{border:1px solid var(--ring);background:var(--surface);border-radius:999px;padding:4px 10px;margin:3px 4px 3px 0;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.examples button:hover{color:var(--ink);border-color:var(--accent)}
.answer{font-size:15px;margin:4px 0 10px}
pre.json{background:var(--surface-2);border-radius:8px;padding:10px;font-size:12px;overflow:auto;max-height:280px}
.loading{padding:60px;text-align:center;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (forced-colors:active){.hb .r i,.stack i,.cellbar i{forced-color-adjust:none;background:CanvasText!important}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand"><b>Samagra Shiksha PAB 2026-27</b><span>Haryana · Madhya Pradesh · Uttar Pradesh — approvals, appraisal cuts and spill-over, every line item</span></div>
    <div class="legend-states" id="stateLegend"></div>
    <button class="themebtn" id="themeBtn" type="button" aria-label="Toggle colour theme">Theme</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"><div class="loading">Loading the three PAB minutes…</div></main>
<div class="tip" id="tip" role="tooltip"></div>
<script src="app.js"></script>
<script src="ask.js"></script>
</body>
</html>
